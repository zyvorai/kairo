apiVersion: v1
kind: ConfigMap
metadata:
  name: kairo-cluster-info
data:
  clusterName: production-eu-1
---
apiVersion: v1
kind: Node
metadata:
  name: worker-a
status:
  allocatable:
    cpu: "8"
    memory: 24Gi
    nvidia.com/gpu: "1"
---
apiVersion: v1
kind: Node
metadata:
  name: worker-b
status:
  allocatable:
    cpu: "8"
    memory: 24Gi
    nvidia.com/gpu: "0"
---
apiVersion: v1
kind: Pod
metadata:
  name: system-a
  namespace: kube-system
spec:
  nodeName: worker-a
  containers:
    - name: system
      resources:
        requests:
          cpu: 1500m
          memory: 4Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: system-b
  namespace: kube-system
spec:
  nodeName: worker-b
  containers:
    - name: system
      resources:
        requests:
          cpu: 2
          memory: 6Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: payments
spec:
  replicas: 4
  template:
    spec:
      containers:
        - name: api
          image: ghcr.io/example/payments:v1
          resources:
            requests:
              cpu: 750m
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: payments
spec:
  selector:
    app: payments-api
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ledger-data
  namespace: payments
spec:
  resources:
    requests:
      storage: 500Gi
