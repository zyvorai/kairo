# OpenAPI description of the Kairo REST API. internal/api/openapi_test.go
# fails when a registered route is missing here (or documented but not
# registered) and when a response/request field of the Go types is missing
# from the matching schema.
openapi: 3.0.3
info:
  title: Kairo API
  version: "1"
  description: >
    Kairo simulates Kubernetes changes against a snapshot of a cluster.
    Every simulation is deterministic and offline; no cluster or cloud API is
    contacted. Request bodies are limited to 4 MiB (413 beyond that).
paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: healthz
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  service: {type: string}
                  time: {type: string, format: date-time}
  /readyz:
    get:
      summary: Readiness probe
      operationId: readyz
      responses:
        "200":
          description: The service is ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready: {type: boolean}
                  service: {type: string}
  /api/v1/version:
    get:
      summary: Build version
      operationId: version
      responses:
        "200":
          description: The running version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: {type: string}
                  version: {type: string}
  /api/v1/examples:
    get:
      summary: Demo cluster snapshot and proposed change
      operationId: examples
      responses:
        "200":
          description: Example manifests (empty strings when the example files are not available).
          content:
            application/json:
              schema:
                type: object
                properties:
                  clusterYaml: {type: string}
                  desiredYaml: {type: string}
  /api/v1/simulate:
    post:
      summary: Simulate a proposed change (kairo plan)
      description: >
        Scheduling fit, rollout surge, HPA headroom, removed/deprecated APIs,
        ResourceQuota and LimitRange admission, security, exposure and RBAC risks.
        Changes are listed in `changes`. Supplying `prices` adds a cost estimate.
      operationId: simulate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateRequest"
      responses:
        "200":
          description: The simulation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
        "400": {$ref: "#/components/responses/BadRequest"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "422": {$ref: "#/components/responses/Unprocessable"}
  /api/v1/drain:
    post:
      summary: Simulate draining nodes (kairo drain)
      operationId: drain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrainRequest"
      responses:
        "200":
          description: The drain result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrainResult"
        "400": {$ref: "#/components/responses/BadRequest"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "422": {$ref: "#/components/responses/Unprocessable"}
  /api/v1/consolidate:
    post:
      summary: Simulate consolidating pods onto fewer nodes (kairo consolidate)
      description: >
        Greedy best-fit packing of controller-managed pods onto fewer nodes with
        the same placement rules as drain. The response lists what is not modelled.
      operationId: consolidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsolidateRequest"
      responses:
        "200":
          description: The consolidation plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsolidateResult"
        "400": {$ref: "#/components/responses/BadRequest"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "422": {$ref: "#/components/responses/Unprocessable"}
  /api/v1/disruption:
    post:
      summary: Score how disruptive removing each node would be (kairo disruption)
      description: >
        A transparent weighted score per node from PodDisruptionBudgets,
        single-replica and all-replicas-here workloads, local state, placement
        constraints and declared probe startup time. Every factor shows its
        points and inputs; missing inputs are listed in unknowns, not defaulted.
      operationId: disruption
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisruptionRequest"
      responses:
        "200":
          description: Nodes, least disruptive first, with the scoring model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisruptionResult"
        "400": {$ref: "#/components/responses/BadRequest"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "422": {$ref: "#/components/responses/Unprocessable"}
  /api/v1/rightsize:
    post:
      summary: What-if request right-sizing from supplied usage samples (kairo rightsize)
      description: >
        Recommends requests from CPU/memory samples you supply (percentile plus
        an explicit safety margin, with a distribution-free confidence interval),
        then consolidates the snapshot under today's, optimistic, expected and
        conservative requests to show nodes and cost as a band. Advisory only:
        nothing is changed. Samples that are not finite non-negative numbers are rejected.
      operationId: rightsize
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RightsizeRequest"
      responses:
        "200":
          description: Per-container recommendations and the scenario band.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RightsizeResult"
        "400": {$ref: "#/components/responses/BadRequest"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "422": {$ref: "#/components/responses/Unprocessable"}
  /api/v1/resilience:
    post:
      summary: Capacity-pool and zone loss report (kairo resilience)
      description: >
        Groups nodes by capacity type, instance type and zone labels, reports
        diversification, and simulates losing each spot pool and each zone at
        once (PodDisruptionBudgets are ignored: a cloud reclaim does not honour
        them). Nodes without labels are listed under unknowns, not guessed.
      operationId: resilience
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResilienceRequest"
      responses:
        "200":
          description: Diversity, loss scenarios and findings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResilienceResult"
        "400": {$ref: "#/components/responses/BadRequest"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "422": {$ref: "#/components/responses/Unprocessable"}
components:
  responses:
    BadRequest:
      description: Invalid JSON or a required field is missing.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    TooLarge:
      description: The request body exceeds 4 MiB.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unprocessable:
      description: The input parsed but cannot be simulated (bad YAML, unknown node, invalid target version or prices).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Error:
      type: object
      properties:
        error: {type: string}
    Prices:
      type: object
      description: Optional user-supplied unit prices. Kairo never calls a cloud pricing API.
      properties:
        currency: {type: string, maxLength: 16, description: "Label only, e.g. USD."}
        nodeHourPrice: {type: number, minimum: 0, description: Price of one node for one hour.}
        gibHourPrice: {type: number, minimum: 0, description: Price of one GiB of memory per hour, only if billed separately from nodes.}
    CostEstimate:
      type: object
      description: A monthly cost change derived from user-supplied prices (730-hour month). An estimate, not a quote; negative amounts are savings.
      properties:
        estimate: {type: boolean}
        currency: {type: string}
        hoursPerMonth: {type: integer}
        nodeHourPrice: {type: number}
        gibHourPrice: {type: number}
        nodeMonthlyDelta: {type: number}
        memoryMonthlyDelta: {type: number}
        monthlyDelta: {type: number}
        basis: {type: string}
        note: {type: string}
    SimulateRequest:
      type: object
      required: [clusterYaml, desiredYaml]
      properties:
        clusterYaml: {type: string, description: Cluster snapshot as YAML or JSON (kubectl get -o yaml).}
        desiredYaml: {type: string, description: Proposed manifests as YAML or JSON.}
        targetVersion: {type: string, example: "1.29", description: Kubernetes minor version manifests must be valid on; empty means the newest known.}
        prices: {$ref: "#/components/schemas/Prices"}
    ResourceRef:
      type: object
      properties:
        kind: {type: string}
        namespace: {type: string}
        name: {type: string}
    Risk:
      type: object
      properties:
        severity: {type: string, enum: [critical, high, medium, low, info]}
        code: {type: string}
        title: {type: string}
        detail: {type: string}
        resource: {$ref: "#/components/schemas/ResourceRef"}
    NodeResult:
      type: object
      properties:
        name: {type: string}
        cpuCapacity: {type: number}
        cpuFree: {type: number}
        memoryCapacityBytes: {type: integer, format: int64}
        memoryFreeBytes: {type: integer, format: int64}
        gpuCapacity: {type: integer, format: int64}
        gpuFree: {type: integer, format: int64}
    FieldChange:
      type: object
      properties:
        field: {type: string}
        old: {type: string}
        new: {type: string}
    Change:
      type: object
      properties:
        kind: {type: string}
        namespace: {type: string}
        name: {type: string}
        action: {type: string, enum: [created, changed, deleted]}
        fields:
          type: array
          items: {$ref: "#/components/schemas/FieldChange"}
    Result:
      type: object
      properties:
        clusterName: {type: string}
        objectsAnalyzed: {type: integer}
        changedObjects: {type: integer}
        createdObjects: {type: integer}
        deletedObjects: {type: integer}
        podsRestarted: {type: integer}
        podsCreated: {type: integer}
        unschedulablePods: {type: integer}
        servicesAffected: {type: integer}
        networkPolicyChanges: {type: integer}
        pvcDestructiveRisks: {type: integer}
        pdbRisks: {type: integer}
        quotaRisks: {type: integer}
        limitRangeRisks: {type: integer}
        securityRisks: {type: integer}
        exposureChanges: {type: integer}
        rbacRisks: {type: integer}
        hpaRisks: {type: integer}
        rolloutRisks: {type: integer}
        rolloutStalls: {type: integer}
        apiRemoved: {type: integer}
        apiDeprecated: {type: integer}
        targetVersion: {type: string}
        cpuDeltaCores: {type: number}
        memoryDeltaBytes: {type: integer, format: int64}
        gpuDelta: {type: integer, format: int64}
        blastRadius: {type: integer, minimum: 0, maximum: 100}
        riskLevel: {type: string, enum: [LOW, MEDIUM, HIGH]}
        verdict: {type: string, enum: [SAFE, REVIEW, BLOCK]}
        risks:
          type: array
          items: {$ref: "#/components/schemas/Risk"}
        recommendations:
          type: array
          items: {type: string}
        nodes:
          type: array
          items: {$ref: "#/components/schemas/NodeResult"}
        changes:
          type: array
          items: {$ref: "#/components/schemas/Change"}
        cost: {$ref: "#/components/schemas/CostEstimate"}
    DrainRequest:
      type: object
      required: [clusterYaml, nodes]
      properties:
        clusterYaml: {type: string}
        nodes:
          type: array
          minItems: 1
          items: {type: string}
    DrainPod:
      type: object
      properties:
        namespace: {type: string}
        name: {type: string}
        node: {type: string}
        action: {type: string, enum: [evict, ignore-daemonset, ignore-static, unmanaged]}
        reschedulable: {type: boolean}
        blockedBy: {type: string}
    DrainResult:
      type: object
      properties:
        nodes:
          type: array
          items: {type: string}
        verdict: {type: string, enum: [SAFE, REVIEW, BLOCK]}
        evicted: {type: integer}
        ignored: {type: integer}
        unmanaged: {type: integer}
        unschedulable: {type: integer}
        pdbBlocked: {type: integer}
        pods:
          type: array
          items: {$ref: "#/components/schemas/DrainPod"}
        risks:
          type: array
          items: {$ref: "#/components/schemas/Risk"}
    ConsolidateRequest:
      type: object
      required: [clusterYaml]
      properties:
        clusterYaml: {type: string}
        prices: {$ref: "#/components/schemas/Prices"}
    ConsolidateNode:
      type: object
      properties:
        name: {type: string}
        removable: {type: boolean}
        reason: {type: string, description: Why a node must stay; empty for removable nodes.}
        movablePods: {type: integer}
        cpuCapacity: {type: number}
        cpuRequested: {type: number}
        memoryCapacityBytes: {type: integer, format: int64}
        memoryRequestedBytes: {type: integer, format: int64}
    ConsolidateMove:
      type: object
      properties:
        namespace: {type: string}
        name: {type: string}
        from: {type: string}
        to: {type: string}
    Utilization:
      type: object
      description: Requested resources divided by allocatable (0 to 1, above 1 when overcommitted).
      properties:
        cpuBefore: {type: number}
        cpuAfter: {type: number}
        memoryBefore: {type: number}
        memoryAfter: {type: number}
    ConsolidateResult:
      type: object
      properties:
        nodesBefore: {type: integer}
        nodesAfter: {type: integer}
        removable:
          type: array
          items: {type: string}
        cpuReclaimCores: {type: number}
        memoryReclaimBytes: {type: integer, format: int64}
        gpuReclaim: {type: integer, format: int64}
        utilization: {$ref: "#/components/schemas/Utilization"}
        nodes:
          type: array
          items: {$ref: "#/components/schemas/ConsolidateNode"}
        moves:
          type: array
          items: {$ref: "#/components/schemas/ConsolidateMove"}
        cost: {$ref: "#/components/schemas/CostEstimate"}
        summary: {type: string}
        notModelled:
          type: array
          items: {type: string}
    DisruptionRequest:
      type: object
      required: [clusterYaml]
      properties:
        clusterYaml: {type: string}
    DisruptionFactor:
      type: object
      properties:
        code: {type: string}
        points: {type: number}
        maxPoints: {type: number}
        detail: {type: string}
        pods:
          type: array
          items: {type: string}
    DisruptionNode:
      type: object
      properties:
        name: {type: string}
        score: {type: integer, minimum: 0, maximum: 100}
        level: {type: string, enum: [LOW, MEDIUM, HIGH, BLOCKED]}
        blockers:
          type: array
          items: {type: string}
        removable: {type: boolean, description: True when consolidate can empty this node on its own.}
        pods: {type: integer}
        factors:
          type: array
          items: {$ref: "#/components/schemas/DisruptionFactor"}
        unknowns:
          type: array
          items: {type: string}
    DisruptionWeight:
      type: object
      properties:
        code: {type: string}
        maxPoints: {type: number}
        saturatesAt: {type: number}
        unit: {type: string}
        description: {type: string}
    DisruptionResult:
      type: object
      properties:
        nodes:
          type: array
          items: {$ref: "#/components/schemas/DisruptionNode"}
        weights:
          type: array
          items: {$ref: "#/components/schemas/DisruptionWeight"}
        warnings:
          type: array
          items: {type: string}
        summary: {type: string}
        notModelled:
          type: array
          items: {type: string}
    UsageSeries:
      type: object
      required: [workload, container]
      properties:
        namespace: {type: string, description: Defaults to "default".}
        workload: {type: string, description: Pod name, controller name, or Deployment name.}
        container: {type: string}
        cpuCores:
          type: array
          items: {type: number}
        memoryBytes:
          type: array
          items: {type: number}
    UsageData:
      type: object
      required: [series]
      properties:
        series:
          type: array
          maxItems: 2000
          items: {$ref: "#/components/schemas/UsageSeries"}
    RightsizeOptions:
      type: object
      properties:
        cpuPercentile: {type: number, description: "(0,1], default 0.95."}
        memoryPercentile: {type: number, description: "(0,1], default 0.99; 1 sizes on the observed peak."}
        cpuMargin: {type: number, description: "0..5, default 0.15."}
        memoryMargin: {type: number, description: "0..5, default 0.20."}
        minSamples: {type: integer, description: "Default 30."}
        confidence: {type: number, description: "0.5..0.999, default 0.90."}
    RightsizeRequest:
      type: object
      required: [clusterYaml, usage]
      properties:
        clusterYaml: {type: string}
        usage: {$ref: "#/components/schemas/UsageData"}
        options: {$ref: "#/components/schemas/RightsizeOptions"}
        prices: {$ref: "#/components/schemas/Prices"}
    EffectiveOptions:
      type: object
      properties:
        cpuPercentile: {type: number}
        memoryPercentile: {type: number}
        cpuMargin: {type: number}
        memoryMargin: {type: number}
        minSamples: {type: integer}
        confidence: {type: number}
        minCpuCores: {type: number}
        minMemoryBytes: {type: integer, format: int64}
    ResourceRec:
      type: object
      properties:
        samples: {type: integer}
        percentile: {type: number}
        observed: {type: number}
        max: {type: number}
        lower: {type: number}
        upper: {type: number}
        lowerOpen: {type: boolean}
        upperOpen: {type: boolean}
        margin: {type: number}
        current: {type: number, description: Today's request per pod; 0 when none is set.}
        optimistic: {type: number}
        expected: {type: number}
        conservative: {type: number}
        aboveExpected: {type: integer}
        basis: {type: string}
    RightsizeContainer:
      type: object
      properties:
        namespace: {type: string}
        workload: {type: string}
        container: {type: string}
        status: {type: string, enum: [recommended, insufficient-samples, unmatched]}
        pods: {type: integer}
        cpu: {$ref: "#/components/schemas/ResourceRec"}
        memory: {$ref: "#/components/schemas/ResourceRec"}
        notes:
          type: array
          items: {type: string}
    RightsizeScenario:
      type: object
      properties:
        name: {type: string, enum: [current, optimistic, expected, conservative]}
        description: {type: string}
        cpuRequestedCores: {type: number}
        memoryRequestedBytes: {type: integer, format: int64}
        nodesBefore: {type: integer}
        nodesAfter: {type: integer}
        removable:
          type: array
          items: {type: string}
        additionalNodesRemovable: {type: integer}
        cost: {$ref: "#/components/schemas/CostEstimate"}
        additionalMonthlyDelta: {type: number}
    RightsizeResult:
      type: object
      properties:
        options: {$ref: "#/components/schemas/EffectiveOptions"}
        containers:
          type: array
          items: {$ref: "#/components/schemas/RightsizeContainer"}
        scenarios:
          type: array
          items: {$ref: "#/components/schemas/RightsizeScenario"}
        noUsageData:
          type: array
          items: {type: string}
        noUsageDataCount: {type: integer}
        summary: {type: string}
        notModelled:
          type: array
          items: {type: string}
    ResilienceRequest:
      type: object
      required: [clusterYaml]
      properties:
        clusterYaml: {type: string}
    ResilienceScenario:
      type: object
      properties:
        kind: {type: string, enum: [pool, zone]}
        name: {type: string}
        capacityType: {type: string}
        instanceType: {type: string}
        zone: {type: string}
        nodes:
          type: array
          items: {type: string}
        cpuShare: {type: number}
        nodeShare: {type: number}
        verdict: {type: string, enum: [SAFE, REVIEW, BLOCK]}
        evicted: {type: integer}
        unschedulable: {type: integer}
        unmanaged: {type: integer}
        risks:
          type: array
          items: {$ref: "#/components/schemas/Risk"}
    CapacityDiversity:
      type: object
      properties:
        capacityType: {type: string}
        nodes: {type: integer}
        instanceTypes: {type: integer}
        zones: {type: integer}
        largestPool: {type: string}
        largestPoolShare: {type: number}
        cpuShareOfCluster: {type: number}
    ResilienceResult:
      type: object
      properties:
        diversity:
          type: array
          items: {$ref: "#/components/schemas/CapacityDiversity"}
        scenarios:
          type: array
          items: {$ref: "#/components/schemas/ResilienceScenario"}
        findings:
          type: array
          items: {$ref: "#/components/schemas/Risk"}
        unknowns:
          type: array
          items: {type: string}
        thresholds:
          type: array
          items: {type: string}
        summary: {type: string}
        notModelled:
          type: array
          items: {type: string}
